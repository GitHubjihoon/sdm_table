<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스드메의 문단속</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5; --surface: #ffffff; --ink: #2b2622; --muted: #8a817a;
    --line: #ebe5de; --accent: #b0605a; --accent-soft: #f6e9e6;
    --plus: #b0605a; --minus: #3f7d5a; --sel: #fbf3ef;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 80px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .status { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: 6px 12px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover { color: var(--accent); }
  .banner { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

  .summary { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
  .card span { display: block; color: var(--muted); font-size: 13px; }
  .card strong { font-size: 20px; font-variant-numeric: tabular-nums; }
  .card.total strong { font-size: 28px; color: var(--accent); }

  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  thead th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px;
    padding: 10px 8px; border-bottom: 1px solid var(--line); background: #fdfcfa; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.cat td { background: #f4efe9; padding: 8px; }
  tr.cat .cat-row { display: flex; align-items: center; gap: 8px; }
  tr.cat input { font-weight: 700; font-size: 15px; flex: 1; }
  tr.cat .subtotal { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.item.selected td { background: var(--sel); }
  tr.add td { padding: 4px 8px 10px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plus { color: var(--plus); } .minus { color: var(--minus); } .zero { color: var(--muted); }
  input[type=text], select { font: inherit; color: inherit; width: 100%; border: 1px solid transparent;
    background: transparent; border-radius: 6px; padding: 5px 6px; }
  input[type=text]:hover, select:hover { border-color: var(--line); }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; }
  input.amount { text-align: right; font-variant-numeric: tabular-nums; }
  input.dim { color: var(--muted); }
  input::placeholder { color: #d6cec6; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .col-vendor { width: 16%; } .col-amount { width: 13%; } .col-type { width: 9%; }
  .col-diff { width: 12%; } .col-sel { width: 6%; text-align: center; } .col-del { width: 4%; }
  .footer-actions { margin-top: 14px; display: flex; gap: 8px; }

  .gate { text-align: center; padding: 80px 16px; }
  .gate p { color: var(--muted); }

  @media (max-width: 680px) {
    .summary { grid-template-columns: 1fr 1fr; }
    .card.total { grid-column: 1 / -1; }
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    table { border: none; background: transparent; }
    tbody { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
    tr.item { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas:
      "vendor amount sel" "note note note" "type diff del"; padding: 6px 4px; border-bottom: 1px solid var(--line); }
    tr.item td { border: none; padding: 2px 4px; }
    tr.item.selected { background: var(--sel); }
    tr.item.selected td { background: transparent; }
    td.c-vendor { grid-area: vendor; } td.c-amount { grid-area: amount; } td.c-sel { grid-area: sel; text-align: center; }
    td.c-note { grid-area: note; } td.c-type { grid-area: type; } td.c-diff { grid-area: diff; align-self: center; }
    td.c-del { grid-area: del; }
    td.c-type select { width: auto; }
    input.amount { width: 120px; }
    tr.cat td, tr.add td { border: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>스드메의 문단속</h1>
      <p class="status" id="status">불러오는 중…</p>
    </div>
    <div class="user" id="user"></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div id="gate" class="gate" hidden>
    <p id="gate-msg">두 분만 볼 수 있는 표입니다. Google 계정으로 로그인해 주세요.</p>
    <button class="primary" id="login-btn">Google로 로그인</button>
  </div>

  <div id="board" hidden>
    <section class="summary">
      <div class="card total"><span>최종 정산 (선택 항목 합계)</span><strong id="total">0</strong></div>
      <div class="card"><span>기준가 대비</span><strong id="diff">0</strong></div>
      <div class="card"><span>기준 패키지</span><strong id="base">0</strong></div>
    </section>

    <table id="table">
      <thead>
        <tr>
          <th class="col-vendor">업체명</th>
          <th class="col-amount num">금액</th>
          <th>비고</th>
          <th class="col-type">유형</th>
          <th class="col-diff num">기준가 대비</th>
          <th class="col-sel">선택</th>
          <th class="col-del"></th>
        </tr>
      </thead>
    </table>

    <div class="footer-actions">
      <button id="add-cat">+ 구분 추가</button>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
